[profile.default]
src = "src"
out = "out"
script = "script"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
chain_id = 10143

# Monad verification (Sourcify): https://docs.monad.xyz/guides/verify-smart-contract/foundry
# The guide's `metadata`/`metadata_hash` keys are not Foundry keys (ignored by forge 1.8.3);
# Foundry defaults (cbor_metadata = true, bytecode_hash = "ipfs") give Sourcify a full match.
use_literal_content = true

# MonadForkTest reads the shared deployment registry
fs_permissions = [{ access = "read", path = "../deployments" }]
